<main>
    <form>
        <div class="container">
            <input type="text" placeholder="Word" [(ngModel)]="word.word" name="word">
            <div class="tags-input-container">
                <div id="tags-wrapper"></div>
                <input type="text" id="tag-field" placeholder="Type and linking to parent" />
            </div>
            <textarea placeholder="Translation" [(ngModel)]="word.definition" name="definition"></textarea>
            @if (isThereDifficulty != false) {
            <p>Selecciona una dificultad</p>
            }
        </div>
    </form>
    <div class="selection-difficulty">
        <button type="button" class="rank SEEN" (click)="changeStatus(3)">1</button>
        <button type="button" class="rank RECOGNIZED" (click)="changeStatus(4)">2</button>
        <button type="button" class="rank VERY_RECOGNIZED" (click)="changeStatus(5)">3</button>
        <button type="button" class="rank VERY_RECOGNIZED_2" (click)="changeStatus(6)">4</button>
        <button type="button" class="rank LEARNED" (click)="changeStatus(7)">5</button>
        <button type="button" class="rank" (click)="changeStatus(8)">Learned</button>
        <button type="button" class="rank" (click)="changeStatus(1)">Ignore</button>
    </div>
    <button type="button" (click)="saveDifficulty()">Save</button>
</main>
