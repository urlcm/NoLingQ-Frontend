<main>
    <form>
        <div class="container">
            <input type="text" placeholder="Word" [(ngModel)]="word.word" name="word">

            <div class="wrapper">
                            <div class="tags-input-container">
                @for (tag of tags; track $index; let i = $index) {
                    <span class="tag">
                        {{tag.word}}
                        <button
                        type="button"
                        class="tag-remove"
                        (click)="removeTag(i)"
                        aria-label="Remove tag"
                        > &times;</button>
                    </span>
                }
                <input
                    type="text"
                    class="tag-input-field"
                    [placeholder]="tags.length === 0 ? placeholder : ''"
                    [(ngModel)]="currentValue.word"
                    name="currentValue"
                    (keydown.enter)="addTag($event)"
                    (keydown.backspace)="onBackspace()"
                />
            </div>
            @if(this.isWordSaved != true){
                <p>Debes guardar la palabra primero</p>
            }
            <button type="button" (click)="linkToParent()">Link to parend</button>                
            </div>

            <textarea placeholder="Translation" [(ngModel)]="word.definition" name="definition"></textarea>
            @if (isThereDifficulty != false) {
            <p>Selecciona una dificultad</p>
            }
        </div>
    </form>
    <div class="selection-difficulty">
        <button type="button" class="rank SEEN" (click)="changeStatus(3)">1</button>
        <button type="button" class="rank RECOGNIZED" (click)="changeStatus(4)">2</button>
        <button type="button" class="rank VERY_RECOGNIZED" (click)="changeStatus(5)">3</button>
        <button type="button" class="rank VERY_RECOGNIZED_2" (click)="changeStatus(6)">4</button>
        <button type="button" class="rank LEARNED" (click)="changeStatus(7)">5</button>
        <button type="button" class="rank" (click)="changeStatus(8)"><i class="fa-solid fa-check"></i></button>
        <button type="button" class="rank" (click)="changeStatus(1)"><i class="fa-solid fa-ban"></i></button>
    </div>
    <button type="button" (click)="saveDifficulty()">Save</button>
</main>
