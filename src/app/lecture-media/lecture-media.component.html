<main class="media">
    <button type="button" (click)="backwardAudio()">
        <i class="fa-solid fa-backward"></i>
    </button>
    <button type="button" (click)="playAudio()"><i class="fa-solid fa-play"></i></button>
    <button type="button" (click)="stopAudio()">
        <i class="fa-solid fa-stop"></i>
    </button>
    <button type="button" (click)="backwardAudio()">
        <i class="fa-solid fa-forward fa-jello"></i>
    </button>
</main>
